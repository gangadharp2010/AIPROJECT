services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: firesprinkler
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: admin@123
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d firesprinkler"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./src/api
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=firesprinkler;Username=appuser;Password=admin@123
      Analytics__BaseUrl: http://ml-service:8001
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
  ml-service:
    build: ./src/ml-service
    ports: ["8001:8001"]
  simulator:
    build: ./src/simulator
    environment: {API_BASE_URL: http://api:8080, INTERVAL_SECONDS: "3"}
    depends_on: [api]
  frontend:
    build: ./src/frontend
    ports: ["4200:4200"]
    depends_on: [api]
volumes: {pgdata: {}}
