services:
  agentic-bug-fixing:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: agentic-bug-fixing
    ports:
      - "7860:7860"
    env_file:
      - ../.env
    environment:
      GRADIO_SERVER_NAME: "0.0.0.0"
      GRADIO_SERVER_PORT: "7860"
    restart: unless-stopped

