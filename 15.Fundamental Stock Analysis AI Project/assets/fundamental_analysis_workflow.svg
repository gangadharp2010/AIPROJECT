<g><rect x="575" y="465" width="350" height="110" rx="18" fill="#ffffff" fill-opacity=".07" stroke="#d6a253" stroke-width="2"/><text x="750" y="509" fill="#f3f8ff" font-size="22" font-weight="700">News &amp; Sentiment Agent</text><text x="750" y="542" fill="#c1d4e8" font-size="17">Headlines • Sentiment • Uncertainty</text></g>
<g><rect x="1075" y="465" width="350" height="110" rx="18" fill="#ffffff" fill-opacity=".07" stroke="#d77da1" stroke-width="2"/><text x="1250" y="509" fill="#f3f8ff" font-size="22" font-weight="700">Risk Agent</text><text x="1250" y="542" fill="#c1d4e8" font-size="17">Leverage • Liquidity • Risk evidence</text></g>
<path d="M250 575V620H750M750 575V620M1250 575V620H750V647" fill="none" stroke="#9bbad9" stroke-width="3" marker-end="url(#arrow)"/>
